# Render Blueprint for the API only (database = Neon, frontend = Vercel). Secrets are set in the Render dashboard.
services:
  - type: web
    name: cm-grievance-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL        # Neon connection string
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS        # your Vercel URL, e.g. https://your-app.vercel.app
        sync: false
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: SEED_ON_STARTUP
        value: "true"
